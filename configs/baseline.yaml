model:
  name: Qwen3-1.7B
  path: ./src/Qwen3-1.7B
  precision: fp16
  quantization: "none"

benchmark:
  num_runs: 3
  warmup_runs: 1
  max_new_tokens: 100

generation:
  do_sample: false

prompts:
  - "Give me a beautiful poem about the beauty of nature."
  - "Tell me a story about a brave knight."
  - "What is the capital of France?"
  - "How do I make a cup of tea?"
  - "What is the square root of 144?"

output:
  directory: ./results
  filename: baseline_fp16.json

eval_texts:
  - "The Industrial Revolution began in Britain in the late 18th century and gradually spread to other parts of Europe and North America, fundamentally transforming manufacturing processes and society."
  - "Photosynthesis is the process by which green plants and some other organisms convert light energy into chemical energy stored in glucose, using carbon dioxide and water as raw materials."
  - "The stock market experienced significant volatility throughout the quarter, with technology shares leading both the gains in early trading and the subsequent losses following interest rate announcements."
  - "Machine learning models require large amounts of labeled training data to learn patterns effectively, though recent advances in self-supervised learning have reduced this dependency considerably."
  - "The novel's protagonist embarks on a journey across three continents, encountering various cultures and challenges that ultimately reshape her understanding of identity and belonging."