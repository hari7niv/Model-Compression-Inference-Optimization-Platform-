[project]
name = "model-optimization-platform"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.0",
    "huggingface>=0.0.1",
    "huggingface-hub>=1.26.1",
    "matplotlib>=3.11.1",
    "optimum>=2.3.0",
    "pyyaml>=6.0.3",
    "torch==2.5.1",
    "transformers>=5.14.1",
]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
